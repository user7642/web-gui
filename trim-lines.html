<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xóa Dòng Trống — Text Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root[data-theme="dark"]{
    --bg:#101216;
    --panel:#181b21;
    --panel-2:#1e222a;
    --border:#2a2f38;
    --border-soft:#22262e;
    --text:#e7e9ee;
    --text-dim:#8a90a0;
    --text-faint:#565c6b;
    --accent:#f0a868;
    --accent-dim:#3a2f22;
    --ok:#5fd4b0;
    --ok-dim:#1c332c;
    --danger:#e26666;
    --shadow: 0 1px 0 rgba(0,0,0,0.4);
  }
  :root[data-theme="light"]{
    --bg:#f4f3ef;
    --panel:#ffffff;
    --panel-2:#fbfaf7;
    --border:#dcd8cf;
    --border-soft:#e8e5dd;
    --text:#1c1c1a;
    --text-dim:#6b6a62;
    --text-faint:#a3a196;
    --accent:#c66a2e;
    --accent-dim:#f2e0cc;
    --ok:#1f8f6e;
    --ok-dim:#dcf2ea;
    --danger:#c8493f;
    --shadow: 0 1px 0 rgba(0,0,0,0.04);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    transition:background .2s ease, color .2s ease;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  .wrap{
    max-width:920px;
    margin:0 auto;
    padding:20px 16px 64px;
  }

  /* header */
  header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    padding-bottom:18px;
    border-bottom:1px solid var(--border);
    margin-bottom:18px;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.14em;
    color:var(--text-faint);
    text-transform:uppercase;
    margin-bottom:6px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow::before{
    content:"";
    width:6px;height:6px;border-radius:50%;
    background:var(--ok);
    display:inline-block;
    box-shadow:0 0 0 3px var(--ok-dim);
  }
  h1{
    font-family:'JetBrains Mono',monospace;
    font-weight:800;
    font-size:26px;
    margin:0;
    letter-spacing:-0.01em;
  }
  h1 span{color:var(--accent);}
  .theme-btn{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:8px 12px;
    border-radius:6px;
    cursor:pointer;
    white-space:nowrap;
  }
  .theme-btn:hover{color:var(--text); border-color:var(--text-faint);}

  /* stats readout */
  .readout{
    font-family:'JetBrains Mono',monospace;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 14px;
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
    box-shadow:var(--shadow);
  }
  .readout .stat{display:flex; flex-direction:column; gap:2px;}
  .readout .stat.out{text-align:right;}
  .readout .label{font-size:10px; letter-spacing:.1em; color:var(--text-faint); text-transform:uppercase;}
  .readout .value{font-size:20px; font-weight:700;}
  .readout .value.removed{color:var(--accent);}
  .readout .arrow{color:var(--text-faint); font-size:18px;}

  /* panel */
  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
    margin-bottom:14px;
    box-shadow:var(--shadow);
  }
  .panel-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 14px;
    border-bottom:1px solid var(--border-soft);
    background:var(--panel-2);
  }
  .panel-title{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--text-dim);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .tag{
    font-size:9px;
    padding:2px 6px;
    border-radius:4px;
    background:var(--accent-dim);
    color:var(--accent);
    letter-spacing:.05em;
  }
  .tag.ok{background:var(--ok-dim); color:var(--ok);}
  .icon-row{display:flex; gap:4px;}
  .icon-btn{
    width:28px; height:28px;
    display:flex; align-items:center; justify-content:center;
    background:transparent;
    border:1px solid transparent;
    border-radius:6px;
    color:var(--text-dim);
    cursor:pointer;
  }
  .icon-btn:hover{background:var(--border-soft); color:var(--text); border-color:var(--border);}
  .icon-btn svg{width:15px; height:15px;}

  textarea{
    width:100%;
    min-height:190px;
    border:none;
    outline:none;
    resize:vertical;
    background:transparent;
    color:var(--text);
    font-family:'JetBrains Mono',monospace;
    font-size:13.5px;
    line-height:1.6;
    padding:14px;
    display:block;
  }
  textarea::placeholder{color:var(--text-faint);}
  textarea[readonly]{background:var(--panel-2);}

  .panel-foot{
    display:flex;
    justify-content:flex-end;
    padding:6px 14px 8px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-faint);
  }

  /* controls */
  .controls{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px;
    margin:16px 0;
  }
  .btn{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13.5px;
    padding:11px 16px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    white-space:nowrap;
  }
  .btn:hover{border-color:var(--text-faint);}
  .btn.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#171208;
    flex:1;
    justify-content:center;
  }
  .btn.primary:hover{filter:brightness(1.06);}
  .btn svg{width:15px; height:15px; flex-shrink:0;}
  .btn.full{width:100%; justify-content:center;}

  .checks{
    display:flex;
    flex-direction:column;
    gap:8px;
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--text-dim);
    margin-bottom:14px;
  }
  .check{display:flex; align-items:center; gap:8px; cursor:pointer;}
  .check input{accent-color:var(--accent); width:15px; height:15px;}

  .url-row{
    display:flex;
    gap:8px;
    margin-bottom:10px;
  }
  .url-row input{
    flex:1;
    font-family:'JetBrains Mono',monospace;
    font-size:12.5px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;
    padding:0 12px;
    color:var(--text);
    outline:none;
  }
  .url-row input:focus{border-color:var(--text-faint);}
  .url-note{
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;
    color:var(--text-faint);
    margin:-6px 0 12px;
    line-height:1.5;
  }

  .footer-actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:6px;
  }

  .toast{
    position:fixed;
    bottom:20px; left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--panel); border:1px solid var(--border);
    color:var(--text);
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    padding:10px 16px;
    border-radius:8px;
    opacity:0;
    transition:opacity .2s ease, transform .2s ease;
    pointer-events:none;
    box-shadow:0 4px 20px rgba(0,0,0,0.25);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @media (max-width:520px){
    h1{font-size:21px;}
    .readout{grid-template-columns:1fr auto 1fr;}
    .footer-actions{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="eyebrow">text-utils / v1</div>
      <h1>Xóa Dòng <span>Trống</span></h1>
    </div>
    <button class="theme-btn" id="themeToggle" type="button">☾ tối</button>
  </header>

  <div class="readout">
    <div class="stat">
      <div class="label">Input</div>
      <div class="value" id="inLines">0 dòng</div>
    </div>
    <div class="arrow">→</div>
    <div class="stat out">
      <div class="label">Đã bỏ</div>
      <div class="value removed" id="removedLines">0 dòng trống</div>
    </div>
  </div>

  <!-- INPUT PANEL -->
  <div class="panel">
    <div class="panel-head">
      <div class="panel-title">văn bản đầu vào <span class="tag" id="autoTag">auto</span></div>
      <div class="icon-row">
        <button class="icon-btn" id="sampleBtn" title="Dán văn bản mẫu" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 3h6l1 4H8l1-4z"/><path d="M6 7h12l-1 13a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1L6 7z"/></svg>
        </button>
        <button class="icon-btn" id="copyInBtn" title="Sao chép" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        </button>
        <button class="icon-btn" id="clearInBtn" title="Xóa hết" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/></svg>
        </button>
      </div>
    </div>
    <textarea id="input" placeholder="Dán văn bản có nhiều dòng trống vào đây..."></textarea>
    <div class="panel-foot"><span id="inSize">0 ký tự</span></div>
  </div>

  <!-- CONTROLS -->
  <div class="checks">
    <label class="check">
      <input type="checkbox" id="autoCheck" checked>
      Tự động xóa khi gõ / dán
    </label>
    <label class="check">
      <input type="checkbox" id="wsCheck" checked>
      Coi dòng chỉ có khoảng trắng là dòng trống
    </label>
  </div>

  <div class="controls">
    <button class="btn primary" id="runBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
      Xóa dòng trống
    </button>
    <label class="btn" for="fileInput">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      File .txt
    </label>
    <input type="file" id="fileInput" accept=".txt" hidden>
    <button class="btn" id="urlToggleBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
      Tải từ URL
    </button>
  </div>

  <div id="urlBox" style="display:none;">
    <div class="url-row">
      <input type="text" id="urlInput" placeholder="https://vidu.com/file.txt" class="mono">
      <button class="btn" id="urlLoadBtn" type="button">Tải</button>
    </div>
    <div class="url-note">* Chỉ tải được nếu trang đích cho phép CORS — nếu lỗi, hãy tải file về rồi dùng nút "File .txt".</div>
  </div>

  <!-- OUTPUT PANEL -->
  <div class="panel">
    <div class="panel-head">
      <div class="panel-title">kết quả <span class="tag ok" id="okTag">sẵn sàng</span></div>
      <div class="icon-row">
        <button class="icon-btn" id="copyOutBtn" title="Sao chép" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        </button>
      </div>
    </div>
    <textarea id="output" placeholder="Kết quả sau khi xóa dòng trống sẽ hiện ở đây..." readonly></textarea>
    <div class="panel-foot"><span id="outSize">0 ký tự</span></div>
  </div>

  <div class="footer-actions">
    <button class="btn full" id="copyOutBtn2" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      Sao chép kết quả
    </button>
    <button class="btn full" id="downloadBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
      Tải file .txt
    </button>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const input = $('input'), output = $('output');
const autoCheck = $('autoCheck'), wsCheck = $('wsCheck');
const toast = $('toast');
let toastTimer;

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toast.classList.remove('show'), 1800);
}

function countLines(text){
  if(text.length === 0) return 0;
  return text.split('\n').length;
}

function process(){
  const raw = input.value;
  const lines = raw.length ? raw.split('\n') : [];
  const treatWsAsEmpty = wsCheck.checked;
  const kept = lines.filter(line => treatWsAsEmpty ? line.trim().length > 0 : line.length > 0);
  const result = kept.join('\n');
  output.value = result;

  const totalIn = countLines(raw);
  const removed = lines.length - kept.length;
  $('inLines').textContent = totalIn + ' dòng';
  $('removedLines').textContent = removed + ' dòng trống';
  $('inSize').textContent = raw.length + ' ký tự';
  $('outSize').textContent = result.length + ' ký tự';
  $('okTag').textContent = removed > 0 ? 'đã xử lý' : 'sẵn sàng';
}

function maybeAutoProcess(){
  if(autoCheck.checked) process();
}

autoCheck.addEventListener('change', () => {
  $('autoTag').textContent = autoCheck.checked ? 'auto' : 'thủ công';
  maybeAutoProcess();
});
wsCheck.addEventListener('change', maybeAutoProcess);
input.addEventListener('input', maybeAutoProcess);
$('runBtn').addEventListener('click', process);

// Sample
$('sampleBtn').addEventListener('click', () => {
  input.value = "Dòng đầu tiên có nội dung\n\n\nDòng thứ hai\n   \nDòng thứ ba sau vài dòng trống\n\n\n\nHết.";
  maybeAutoProcess();
});

// Clear input
$('clearInBtn').addEventListener('click', () => {
  input.value = '';
  process();
});

// Copy helpers
async function copyText(text, label){
  try{
    await navigator.clipboard.writeText(text);
    showToast(label + ' đã sao chép ✓');
  }catch(e){
    showToast('Không thể sao chép — hãy chọn văn bản thủ công');
  }
}
$('copyInBtn').addEventListener('click', () => copyText(input.value, 'Văn bản đầu vào'));
$('copyOutBtn').addEventListener('click', () => copyText(output.value, 'Kết quả'));
$('copyOutBtn2').addEventListener('click', () => copyText(output.value, 'Kết quả'));

// File upload
$('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    input.value = ev.target.result;
    process();
    showToast('Đã tải file: ' + file.name);
  };
  reader.readAsText(file, 'utf-8');
  e.target.value = '';
});

// URL load
$('urlToggleBtn').addEventListener('click', () => {
  const box = $('urlBox');
  box.style.display = box.style.display === 'none' ? 'block' : 'none';
});
$('urlLoadBtn').addEventListener('click', async () => {
  const url = $('urlInput').value.trim();
  if(!url) return;
  try{
    showToast('Đang tải...');
    const res = await fetch(url);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    input.value = text;
    process();
    showToast('Đã tải nội dung từ URL ✓');
  }catch(err){
    showToast('Lỗi tải URL (có thể do CORS)');
  }
});

// Download
$('downloadBtn').addEventListener('click', () => {
  if(!output.value){ showToast('Chưa có kết quả để tải'); return; }
  const blob = new Blob([output.value], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'ket-qua-xoa-dong-trong.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Đã tải xuống file');
});

// Theme toggle
const html = document.documentElement;
$('themeToggle').addEventListener('click', () => {
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  $('themeToggle').textContent = isDark ? '☀ sáng' : '☾ tối';
});

process();
</script>
</body>
</html>
